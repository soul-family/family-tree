<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} - {{ site.title }}{% else %}Family Tree Archive{% endif %}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <div class="layout-wrapper">
    <aside class="sidebar">
      <div class="sidebar-content">
        {% include navigation.html %}
      </div>
    </aside>
    <main class="main-content">
      <div class="site-header">
        <button class="sidebar-toggle" aria-label="Toggle menu" onclick="toggleSidebar()"></button>
        <a class="site-title" href="{{ '/' | relative_url }}">Soul Family Tree</a>
      </div>
      <div class="container container-1185">
        <h1>{{ page.title }}</h1>
        {{ content }}
      </div>
      {% include footer.html %}
    </main>
  </div>
  <script>
    function toggleSidebar() {
      document.querySelector('.layout-wrapper').classList.toggle('sidebar-expanded');
      document.cookie = 'sidebarState=' + (document.querySelector('.layout-wrapper').classList.contains('sidebar-expanded') ? 'expanded' : 'collapsed') + ';path=/;max-age=31536000';
    }
    (function() {
      var match = document.cookie.match(/sidebarState=(expanded|collapsed)/);
      var state = match ? match[1] : 'expanded';
      if (state === 'collapsed') {
        document.querySelector('.layout-wrapper').classList.remove('sidebar-expanded');
      } else {
        document.querySelector('.layout-wrapper').classList.add('sidebar-expanded');
      }
    })();
  </script>
</body>
</html>
