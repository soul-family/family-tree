<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} - {{ site.title }}{% else %}Family Tree Archive{% endif %}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <button class="sidebar-toggle" aria-label="Toggle menu" onclick="document.querySelector('.sidebar').classList.toggle('is-open'); document.querySelector('.sidebar-overlay').classList.toggle('is-open');">⋮</button>
  <div class="sidebar-overlay" onclick="document.querySelector('.sidebar').classList.remove('is-open'); this.classList.remove('is-open');"></div>
  <div class="layout-wrapper">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <a class="site-title" href="{{ '/' | relative_url }}">Soul Family Tree</a>
      </div>
      {% include navigation.html %}
    </aside>
    <main class="main-content">
      <div class="container container-1185">
        <h1>{{ page.title }}</h1>
        {{ content }}
      </div>
      {% include footer.html %}
    </main>
  </div>
</body>
</html>
